services:
  - type: web
    name: voice-answer-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: TRANSCRIBE_MODEL
        value: gpt-4o-mini-transcribe
      - key: OPENAI_API_KEY
        sync: false
